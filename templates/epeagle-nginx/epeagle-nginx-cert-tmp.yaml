apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: epeagle-nginx-cert-tmp
spec:
  secretName: epeagle-nginx-cert-tmp
  dnsNames:
    - {{ .Values.DomainWebTmp }}
    - www.{{ .Values.DomainWebTmp }}
  issuerRef:
    name: lets-encrypt-issuer-prod
    kind: ClusterIssuer
    group: cert-manager.io
