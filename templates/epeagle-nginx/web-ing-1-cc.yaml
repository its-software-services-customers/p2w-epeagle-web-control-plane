apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-codecheck1-ing
  annotations:
    kubernetes.io/ingress.class: "nginx"
    kubernetes.io/ingress.allow-http: "true" #Wordpress will redirect to https internally
spec:
  tls:
    - hosts:
      - {{ .Values.DomainWeb1 }}
      - www.{{ .Values.DomainWeb1 }}
      secretName: web-cert-1
  rules:
    - host: {{ .Values.DomainWeb1 }}
      http:
        paths:
          - path: /epeagle
            pathType: Prefix
            backend:
              service:
                name: codecheck-external-ip
                port:
                  number: 80
  
    - host: www.{{ .Values.DomainWeb1 }}
      http:
        paths:
          - path: /epeagle
            pathType: Prefix
            backend:
              service:
                name: codecheck-external-ip
                port:
                  number: 80
