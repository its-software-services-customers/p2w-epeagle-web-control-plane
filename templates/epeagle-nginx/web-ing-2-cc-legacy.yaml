apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-codecheck2-legacy-ing
  annotations:
    kubernetes.io/ingress.class: "nginx"
    kubernetes.io/ingress.allow-http: "true" #Wordpress will redirect to https internally
    nginx.ingress.kubernetes.io/rewrite-target: /epeagle
spec:
  tls:
    - hosts:
      - {{ .Values.DomainWeb2 }}
      - www.{{ .Values.DomainWeb2 }}
      secretName: web-cert-2
  rules:
    - host: {{ .Values.DomainWeb2 }}
      http:
        paths:
          - path: /check_sn.php
            pathType: Prefix
            backend:
              service:
                name: codecheck-external-ip
                port:
                  number: 80
  
    - host: www.{{ .Values.DomainWeb2 }}
      http:
        paths:
          - path: /check_sn.php
            pathType: Prefix
            backend:
              service:
                name: codecheck-external-ip
                port:
                  number: 80
