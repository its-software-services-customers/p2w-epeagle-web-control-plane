apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb-secret
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: k8s-secret-store      # name of the SecretStore (or kind specified)
  target:
    name: mariadb-secret       # name of the k8s Secret to be created
    creationPolicy: Owner
  data:

  - secretKey: MARIADB_ROOT_PASSWORD
    remoteRef:
      key: "initial-secret"
      property: MARIADB_ROOT_PASSWORD

  - secretKey: MARIADB_PASSWORD
    remoteRef:
      key: "initial-secret"
      property: MARIADB_PASSWORD

  - secretKey: MARIADB_USER
    remoteRef:
      key: "initial-secret"
      property: MARIADB_USER
