epeagle-php:
  pods:
    replicas: 1

    resources:
      limits:
        cpu: 300m
        memory: 350Mi
      requests:
        cpu: 100m
        memory: 100Mi

    env:
      - name: DB_HOST
        value: 'mariadb'

      - name: DB_NAME
        valueFrom:
          secretKeyRef:
            name: mariadb-secret
            key: MARIADB_DATABASE

      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: mariadb-secret
            key: MARIADB_USER

      - name: DB_PASS
        valueFrom:
          secretKeyRef:
            name: mariadb-secret
            key: MARIADB_PASSWORD

      - name: DB_CHARSET
        value: 'utf8mb4'
