apiVersion: v2
name: helm-epeagle
description: A Helm chart for EP eagle web

type: application
version: 1.0.0
appVersion: "1.0"

dependencies:

  ### MariaDB ###
  - name: "mariadb"
    alias: mariadb
    condition: mariadb.enabled
    repository: "https://charts.bitnami.com/bitnami"
    version: "27.0.1"

  ### EP eagle Ngginx ###
  - name: "generic-app"
    alias: epeagle-nginx
    condition: epeagle-nginx.enabled
    repository: "https://charts.visonneau.fr/"
    version: "0.0.14"

  ### EP eagle PHP ###
  - name: "generic-app"
    alias: epeagle-php
    condition: epeagle-php.enabled
    repository: "https://charts.visonneau.fr/"
    version: "0.0.14"
